<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Forgot Password | ReServe</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <!-- CSS -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/variables.css') }}"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/components.css') }}"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/forgot-password.css') }}"
    />
  </head>

  <body>
    <!-- Background -->
    <div class="background">
      <span class="blob blob-1"></span>
      <span class="blob blob-2"></span>
      <span class="blob blob-3"></span>
    </div>

    <main class="forgot-page">
      <a href="{{ url_for('login') }}" class="back-home">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Back to Login</span>
      </a>

      <section class="forgot-wrapper">
        <div class="page-icon">
          <i class="fa-solid fa-key"></i>
        </div>

        <h2 class="forgot-title">Forgot Password</h2>

        <!-- Subtitle -->
        <p class="subtitle">
          Enter your email address and we'll send you a secure password reset
          link.
        </p>

        <!-- Form -->
        <form id="forgotForm">
          <div class="input-group">
            <label for="email">Email Address</label>

            <div class="input-field">
              <i class="fa-regular fa-envelope"></i>

              <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
                spellcheck="false"
                required
              />
            </div>
          </div>

          <button type="submit" class="send-btn">
            <span>Send Reset Link</span>
            <i class="fa-solid fa-arrow-right"></i>
          </button>

          <!-- Success Message -->
          <div id="successMessage" class="success-message">
            <i class="fa-solid fa-circle-check"></i>
            <span></span>
          </div>

          <!-- Error Message -->
          <div id="errorMessage" class="error-message">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span></span>
          </div>
        </form>

        <!-- Divider -->
        <div class="divider">
          <span></span>
          <br />
          <p>OR</p>
          <span></span>
        </div>

        <!-- Login Link -->
        <p class="login-text">
          Remember your password?

          <a href="{{ url_for('login') }}">
            Back to Login
            <i class="fa-solid fa-arrow-right"></i>
          </a>
        </p>
      </section>
    </main>

    <script src="{{ url_for('static', filename='js/forgot-password.js') }}"></script>
  </body>
</html>
