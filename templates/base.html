<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{% block title %}ReServe{% endblock %}</title>

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />

    <!-- CSS -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/navbar.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/hero.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/statistics.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/about.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/solutions.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/marketplace.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/testimonials.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/faq.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/footer.css') }}"
    />

    {% block extra_css %}{% endblock %}
  </head>

  <body>
    <!-- ================= Navbar ================= -->

    <header class="navbar">
      <div class="container nav-container">
        <a href="/" class="logo">
          <i class="fa-solid fa-leaf"></i>
          ReServe
        </a>

        <nav>
          <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Features</a></li>
            <li><a href="#">Marketplace</a></li>
            <li><a href="#">Contact</a></li>
          </ul>
        </nav>

        <div class="nav-buttons">
          <a href="{{ url_for('login') }}">Login</a>

          <a href="{{ url_for('signup') }}" class="btn btn-primary">
            Sign Up
          </a>
        </div>
      </div>
    </header>

    {% block content %} {% endblock %}

    <script src="{{ url_for('static', filename='js/statistics.js') }}"></script>
    <script src="{{ url_for('static', filename='js/faq.js') }}"></script>
    <script src="{{ url_for('static', filename='js/footer.js') }}"></script>
  </body>
</html>
