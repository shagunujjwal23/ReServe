<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Create Account | ReServe</title>

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/signup.css') }}"
    />
  </head>

  <body class="signup-page">
    <!-- Background -->
    <div class="background">
      <span class="blob blob1"></span>
      <span class="blob blob2"></span>
      <span class="blob blob3"></span>
    </div>

    <!-- Back Button -->
    <a href="{{ url_for('home') }}" class="back-home">
      <i class="fa-solid fa-arrow-left"></i>
      <span>Back to Home</span>
    </a>

    <!-- Signup Card -->
    <main class="signup-wrapper">
      <!-- Logo -->
      <a href="{{ url_for('home') }}" class="logo">
        <i class="fa-solid fa-leaf"></i>
        <span>ReServe</span>
      </a>

      <h1>Create Account</h1>

      <p class="subtitle">
        Join ReServe and start making a difference by reducing food waste in
        your community.
      </p>

      <!-- Form -->
      <form id="signupForm">
        <!-- Full Name -->
        <div class="input-group">
          <label for="name">Full Name</label>

          <div class="input-field">
            <i class="fa-solid fa-user"></i>

            <input
              type="text"
              id="name"
              placeholder="Enter your full name"
              autocomplete="name"
              required
            />
          </div>
          <p id="nameMessage" class="field-message"></p>
        </div>

        <!-- Email -->
        <div class="input-group">
          <label for="email">Email Address</label>

          <div class="input-field">
            <i class="fa-solid fa-envelope"></i>

            <input
              type="email"
              id="email"
              placeholder="Enter your email"
              autocomplete="email"
              required
            />
          </div>
          <p id="emailMessage" class="field-message"></p>
        </div>

        <!-- Password -->
        <div class="input-group">
          <label for="password">Password</label>

          <div class="input-field password-field">
            <i class="fa-solid fa-lock"></i>

            <input
              type="password"
              id="password"
              placeholder="Create a password"
              autocomplete="new-password"
              required
            />

            <button
              type="button"
              class="toggle-password"
              id="togglePassword"
              aria-label="Show Password"
            >
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>

          <!-- Password Validation -->
          <p id="passwordMessage" class="field-message"></p>
        </div>

        <!-- Confirm Password -->
        <div class="input-group">
          <label for="confirmPassword">Confirm Password</label>

          <div class="input-field password-field">
            <i class="fa-solid fa-lock"></i>

            <input
              type="password"
              id="confirmPassword"
              placeholder="Confirm your password"
              autocomplete="new-password"
              required
            />

            <button
              type="button"
              class="toggle-password"
              id="toggleConfirmPassword"
              aria-label="Show Password"
            >
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>

          <!-- Password Match -->
          <p id="matchMessage" class="field-message"></p>
        </div>

        <!-- Terms -->
        <div class="options">
          <label class="remember">
            <input type="checkbox" id="terms" required />

            <span>
              I agree to the
              <a href="#">Terms</a>
              &
              <a href="#">Privacy Policy</a>
            </span>
          </label>
        </div>

        <!-- Signup Button -->
        <button type="submit" class="signup-btn">
          <span>Create Account</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>

        <!-- Success -->
        <div id="successMessage" class="success-message">
          <i class="fa-solid fa-circle-check"></i>
          <span></span>
        </div>

        <!-- Error -->
        <div id="errorMessage" class="error-message">
          <i class="fa-solid fa-circle-exclamation"></i>
          <span></span>
        </div>
      </form>

      <!-- Divider -->
      <div class="divider">
        <span>OR</span>
      </div>

      <!-- Google Signup -->
      <button class="google-btn" id="googleSignup">
        <img
          src="https://www.svgrepo.com/show/475656/google-color.svg"
          alt="Google"
        />

        Continue with Google
      </button>

      <!-- Login -->
      <p class="login-text">
        Already have an account?
        <a href="{{ url_for('login') }}">Login</a>
      </p>
    </main>

    <script src="{{ url_for('static', filename='js/signup.js') }}"></script>
  </body>
</html>
