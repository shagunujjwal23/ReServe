<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password | ReServe</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/reset-password.css') }}"
    />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>

  <body>
    <!-- Background Blobs -->
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>

    <div class="reset-container">
      <div class="reset-wrapper">
        <!-- Back -->
        <a href="{{ url_for('login') }}" class="back-link">
          <i class="fa-solid fa-arrow-left"></i>
          Back to Login
        </a>

        <!-- Icon -->
        <div class="icon-circle">
          <i class="fa-solid fa-lock-open"></i>
        </div>

        <!-- Heading -->
        <h1>Create New Password</h1>

        <p class="subtitle">
          Your new password must be different from your previous password.
        </p>

        <!-- Success -->
        <div class="success-message" id="successMessage" style="display: none">
          <i class="fa-solid fa-circle-check"></i>
          <span>Password updated successfully.</span>
        </div>

        <!-- Error -->
        <div class="error-message" id="errorMessage" style="display: none">
          <i class="fa-solid fa-circle-exclamation"></i>
          <span></span>
        </div>

        <!-- Form -->
        <form id="resetForm">
          <!-- Password -->
          <div class="input-group">
            <label for="password">New Password</label>

            <div class="password-wrapper">
              <input
                type="password"
                id="password"
                class="input-field"
                placeholder="Enter new password"
                autocomplete="new-password"
                required
              />

              <button type="button" class="toggle-password">
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>

            <p id="passwordMessage" class="field-message"></p>
          </div>

          <!-- Confirm Password -->
          <div class="input-group">
            <label for="confirmPassword">Confirm New Password</label>

            <div class="password-wrapper">
              <input
                type="password"
                id="confirmPassword"
                class="input-field"
                placeholder="Confirm new password"
                autocomplete="new-password"
                required
              />

              <button type="button" class="toggle-password">
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>

            <p id="matchMessage" class="field-message"></p>
          </div>

          <!-- Button -->
          <button type="submit" class="reset-btn">
            <span>Reset Password</span>

            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </form>

        <!-- Bottom Link -->
        <p class="login-text">
          Remember your password?
          <a href="{{ url_for('login') }}">Sign In</a>
        </p>
      </div>
    </div>

    <script src="{{ url_for('static', filename='js/reset-password.js') }}"></script>
  </body>
</html>
