<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NGO {{ view|title }} | ReServe</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <!-- NGO Navbar CSS -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/ngo-navbar.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/ngo-dashboard.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/ngo-workspace.css') }}"
    />
  </head>
  <body data-view="{{ view }}">
    <!-- =========================
         NAVBAR
    ========================== -->
    <nav class="ngo-navbar">
      <!-- Brand -->
      <a href="/ngo-dashboard" class="ngo-brand">
        <div class="ngo-logo">
          <img
            src="{{ url_for('static', filename='images/reserve-logo.svg') }}"
            alt="ReServe"
          />
        </div>

        <div class="ngo-brand-text">
          <h2>ReServe</h2>
          <span>From Surplus to Solution</span>
        </div>
      </a>

      <!-- Navigation -->
      <div class="ngo-nav-links">
        <a href="/ngo-dashboard" class="ngo-nav-item">
          <i class="ri-home-5-line"></i>
          <span>Home</span>
        </a>

        <a href="/ngo-explore-food" class="ngo-nav-item">
          <i class="ri-search-line"></i>
          <span>Explore Food</span>
        </a>

        <a href="/ngo-claims" class="ngo-nav-item">
          <i class="ri-calendar-check-line"></i>
          <span>My Claims</span>
        </a>

        <a href="/ngo-impact" class="ngo-nav-item">
          <i class="ri-heart-3-line"></i>
          <span>Impact</span>
        </a>

        <a href="/messages" class="ngo-nav-item">
          <i class="ri-message-3-line"></i>
          <span>Messages</span>
        </a>
      </div>

      <!-- Right Side -->
      <div class="ngo-nav-actions">
        <button
          type="button"
          class="ngo-icon-btn"
          id="notificationBtn"
          title="Notifications"
        >
          <i class="ri-notification-3-line"></i>
          <span class="ngo-badge">3</span>
        </button>

        <div class="ngo-profile-wrapper">
          <button type="button" class="ngo-profile-btn" id="ngoProfileBtn">
            <div class="ngo-profile-avatar">
              {% if user and user.profile_image %}
              <img src="{{ user.profile_image }}" alt="Profile" />
              {% else %}
              <img
                src="{{ url_for('static', filename='images/profile-placeholder.jpg') }}"
                alt="Profile"
              />
              {% endif %}
            </div>

            <div class="ngo-profile-info">
              <strong>
                {{ user.organization_name or user.name or "NGO" }}
              </strong>

              <span>NGO</span>
            </div>

            <i class="ri-arrow-down-s-line"></i>
          </button>

          <!-- Profile Dropdown -->
          <div class="ngo-profile-dropdown hidden" id="ngoProfileDropdown">
            <a href="/ngo-profile">
              <i class="ri-user-line"></i>
              Profile
            </a>

            <a href="/ngo-settings">
              <i class="ri-settings-3-line"></i>
              Settings
            </a>

            <div class="dropdown-divider"></div>

            <a href="{{ url_for('auth.logout') }}">
              <i class="ri-logout-box-r-line"></i>
              Logout
            </a>
          </div>
        </div>
      </div>
    </nav>

    <main class="ngo-workspace">
      <header>
        <span class="workspace-label">NGO OPERATIONS</span>
        <h1 id="workspaceTitle">Loading…</h1>
        <p id="workspaceIntro"></p>
      </header>
      <section id="workspaceContent" class="workspace-content">
        <div class="workspace-loading">
          <i class="ri-loader-4-line ri-spin"></i> Loading…
        </div>
      </section>
    </main>

    <script src="{{ url_for('static', filename='js/ngo-workspace.js') }}"></script>
    <script>
      (function () {
        const btn = document.getElementById("ngoProfileBtn");
        const dropdown = document.getElementById("ngoProfileDropdown");
        if (btn && dropdown) {
          btn.addEventListener("click", function (e) {
            e.stopPropagation();
            dropdown.classList.toggle("hidden");
          });
          document.addEventListener("click", function (e) {
            if (!dropdown.contains(e.target) && !btn.contains(e.target)) {
              dropdown.classList.add("hidden");
            }
          });
        }
      })();
    </script>
  </body>
</html>
